<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Parametric generator of transformer bobbin parts with DXF export.">
    <title>Transformer bobbin template</title>
    <link rel="stylesheet" href="styles.css">
    <script src="i18n.js" defer></script>
    <script src="defaults.js" defer></script>
    <script src="templates/geometry.js" defer></script>
    <script src="templates/sidewall.js" defer></script>
    <script src="templates/horizontal.js" defer></script>
    <script src="templates/vertical.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">BA · TRAFO BOBBIN MAKER</p>
        <h1 id="site-title">Transformer bobbin template</h1>
        <a class="source-link" id="source-link" href="https://github.com/mcfly722/trafo-bobbin-maker">Source code on GitHub</a>
        <span class="version">v1.3</span>
      </div>
      <div class="header-actions">
        <button class="lang-button" id="lang-toggle" type="button">RU</button>
        <button class="export-button" id="export-dxf" type="button">Export to DXF · 6 parts</button>
      </div>
    </header>

    <main>
      <section class="parameters panel" aria-labelledby="parameters-heading">
        <div class="section-heading">
          <h2 id="parameters-heading">Bobbin parameters (mm)</h2>
          <button class="text-button" id="reset" type="button">Reset</button>
        </div>
        <form id="parameters-form">
          <div id="parameter-fields" class="parameter-groups"></div>
        </form>
        <p class="share-note" id="share-note">Copy the page URL to share these dimensions.</p>
      </section>

      <section class="drawings" aria-labelledby="drawings-heading">
        <div class="section-heading drawings-heading">
          <h2 id="drawings-heading">Bobbin parts</h2>
        </div>
        <div id="part-tabs" class="part-tabs" role="tablist" aria-label="Part selection"></div>
        <div id="drawing-detail"></div>
      </section>
    </main>

    <dialog class="validation-dialog" id="validation-dialog" aria-labelledby="validation-dialog-title">
      <h2 id="validation-dialog-title">Parameter issues</h2>
      <ul id="validation-dialog-errors"></ul>
      <form method="dialog">
        <button class="text-button" id="validation-dialog-close" type="submit">Close</button>
      </form>
    </dialog>
  </body>
</html>
